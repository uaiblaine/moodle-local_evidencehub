# Stage E4, the old list retired (docs/design/data-report-study.md). Retired with the code they guarded, each
# guard gone with it (their scripts removed):
#   G181_unstable_tie_break: hub_query::order_by() is gone: the list's order is the report's (headless_table::page_order())
#   G176_generation_unkeyed: hub_kpis::get() and its key are gone: the report's key holds its generation (G487)
#   G165_download_shows_restricted: hub_download::row() is gone: the file is the report's table, masked by the entities (G167, G168, G190, G193)
#   G183_posted_pairs_ignored: the download of ticked rows is gone (decision 9)
#   G188_competency_name_escaped: hub_download::row() is gone
#   G187_template_name_escaped: output\hub_page is gone; the picker's escaping is test_the_picker_escapes_a_hostile_category_name_once's
#   G189_cohort_name_escaped: output\hub_page and its cohort select are gone
#   G192_download_count_shown: hub_download::row() is gone: the report's count column is masked (G193)
#   G200_with_changes_anything: hub_filter::with() is gone
#   G201_with_unvalidated: hub_filter::with() is gone
#   G202_search_cached: hub_kpis::get() is gone: the report never caches a search (its own gates)
#   G246_matrix_view_unvalidated: hub_filter's view is gone: the matrix is index.php's view parameter
#   G247_matrix_workers_access_cut: the matrix's workers are the report's matching set, cut by the pair set's own access rule (G157); the base set beside it narrows nothing more
#   G249_matrix_count_access_cut: the matrix counts the matching set, cut by the pair set's own access rule (G157)
#   G252_matrix_restricted_number: one guard with G161 now: the base set's key reads 0 for a restricted pair, and G161 names the matrix's tests too
#   G253_matrix_status_filter_dropped: the matrix's status HAVING is gone: the stored status filter reaches it through the report (G524)
#   G254_matrix_status_filter_every_pair: the matrix's status HAVING is gone
#   G255_matrix_name_sort_ignored: the matrix has no sort by name any more: urgency, then name
#   G258_matrix_name_tie_dropped: the matrix has no sort by name any more
#   G262_matrix_count_always_queries: the matrix's count no longer reads the KPIs: it counts the matching set (G527)
#   G263_matrix_count_always_kpis: the matrix's count no longer reads the KPIs
#   G317_matrix_form_without_filter: the matrix's form carries the template, the view and the scope, no filter (test_the_page_renders_the_matrix)

